server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Coolify / Traefik health. Not an application route.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite hashed assets — cache forever, never fall back to the SPA.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router (BrowserRouter): unknown paths serve index.html.
    # API traffic is on https://api.somwave.botandev.com — this server does not proxy it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
