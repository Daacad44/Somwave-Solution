server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Coolify / Traefik health. Not an application route.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite hashed assets — cache forever, never fall back to the SPA.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API so auth cookies are first-party on app.somwave.botandev.com.
    # The SPA calls /api/v1/*; nginx forwards to the public API. Without this,
    # a cross-origin fetch to api.* drops SameSite=Lax cookies and login bounces.
    location /api/ {
        proxy_pass https://api.somwave.botandev.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.somwave.botandev.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # React Router (BrowserRouter): unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
